# Managed by the API migration platform. Regenerate with the onboarding tool.
#
# This job runs only for issues opened by the platform's GitHub App that also
# carry the migration label. It never runs for issues opened by anyone else.
name: API Migration (Claude)

on:
  issues:
    types: [opened, labeled]

jobs:
  migrate:
    if: >-
      github.event.issue.user.login == 'setorra[bot]' &&
      contains(github.event.issue.labels.*.name, 'api-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run the Claude coding agent
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "setorra[bot]"
          label_trigger: "api-migration"
